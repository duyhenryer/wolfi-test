---
contents:
  repositories:
    - https://packages.wolfi.dev/os
    - '@local ./packages/'
    - https://wolfi.duyne.me
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - https://wolfi.duyne.me/wolfi-melange.rsa.pub
  packages:
    - busybox
    - bash
    - ca-certificates-bundle
    - openjdk-17-jre
    - flyway12@local

environment:
  FLYWAY_VERSION: "12.0.0"
  FLYWAY_HOME: "/opt/flyway12"
  FLYWAY_LOCATIONS: "filesystem:/opt/flyway12/sql"
  PATH: /usr/lib/jvm/java-17-openjdk/bin:/usr/sbin:/sbin:/usr/bin:/bin:/usr/local/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

work-dir: /opt/flyway12

entrypoint:
  command: /usr/local/bin/flyway12

cmd: --help

accounts:
  groups:
    - groupname: flyway
      gid: 65532
  users:
    - username: flyway
      uid: 65532
  run-as: 65532

archs:
  - amd64
  - arm64
